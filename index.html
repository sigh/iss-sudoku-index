<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTC → ISS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Prism (the same build ISS uses) before our styles so style.css can override. -->
  <link rel="stylesheet" href="lib/prism-tomorrow.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="lib/prism.min.js"></script>
  <script defer src="lib/prism-javascript.min.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2SQH4BL89R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-2SQH4BL89R');
  </script>

  <script type="module" src="js/app.js"></script>
</head>

<body>
  <header>
    <div class="titles">
      <h1>CTC → ISS</h1>
      <p class="subtitle">
        AI&#8209;generated
        <a href="https://sigh.github.io/Interactive-Sudoku-Solver/" target="_blank"
          rel="noopener noreferrer">Interactive Sudoku Solver</a> constraints
        for <a href="https://www.youtube.com/@CrackingTheCryptic" target="_blank"
          rel="noopener noreferrer">Cracking&nbsp;The&nbsp;Cryptic</a> videos
      </p>
    </div>
    <div class="header-side">
      <nav class="attribution">
        [<a href="https://github.com/sigh/iss-sudoku-index" target="_blank" rel="noopener noreferrer">source code</a>]
        [<a href="https://sigh.github.io/" target="_blank" rel="noopener noreferrer">sigh.github.io</a>]
      </nav>
      <div class="density-control" role="group" aria-label="Row density">
        <label>
          <input type="radio" name="density" value="compact">
          <span>Compact</span>
        </label>
        <label>
          <input type="radio" name="density" value="medium" checked>
          <span>Medium</span>
        </label>
        <label>
          <input type="radio" name="density" value="spacious">
          <span>Spacious</span>
        </label>
      </div>
    </div>
  </header>

  <section id="controls">
    <input type="search" id="filter" placeholder="Filter by puzzle, author, or constraint…" autocomplete="off">
    <div class="status-controls">
      <div id="legend" class="legend"><!-- status filter chips, populated by JS --></div>
      <span id="count" class="count"></span>
    </div>
  </section>

  <main>
    <table id="index">
      <colgroup>
        <col class="col-video">
        <col class="col-puzzle">
        <col class="col-status">
        <col class="col-guesses">
        <col class="col-constraint">
      </colgroup>
      <thead>
        <tr>
          <th data-sort="date" class="col-video">Video/Date</th>
          <th data-sort="title" class="col-puzzle">Puzzle</th>
          <th data-sort="status" class="col-status">Status</th>
          <th data-sort="guesses" class="col-num">Guesses</th>
          <th data-sort="constraint" class="col-constraint">Constraint</th>
        </tr>
      </thead>
      <tbody id="rows"><!-- rows populated by JS --></tbody>
    </table>
    <p id="empty" class="empty" hidden>No puzzles match.</p>
  </main>
</body>

</html>
