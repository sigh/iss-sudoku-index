<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTC → ISS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Start the index downloads before app.js loads; crossorigin matches fetch()'s
       default mode so the preloaded responses are reused. -->
  <link rel="preload" href="data/mappings-recent.json" as="fetch" crossorigin>
  <link rel="preload" href="data/mappings-archive.json" as="fetch" crossorigin>
  <!-- Prism (the same build ISS uses) before our styles so style.css can override. -->
  <link rel="stylesheet" href="lib/prism-tomorrow.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="lib/prism.min.js"></script>
  <script defer src="lib/prism-javascript.min.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2SQH4BL89R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-2SQH4BL89R');
  </script>

  <script type="module" src="js/app.js"></script>
</head>

<body>
  <header>
    <div class="titles">
      <h1>CTC → ISS</h1>
      <p class="subtitle">
        AI&#8209;generated
        <a href="https://sigh.github.io/Interactive-Sudoku-Solver/" target="_blank"
          rel="noopener noreferrer">Interactive Sudoku Solver</a> constraints
        for <a href="https://www.youtube.com/@CrackingTheCryptic" target="_blank"
          rel="noopener noreferrer">Cracking&nbsp;The&nbsp;Cryptic</a> videos
      </p>
    </div>
    <div class="header-side">
      <nav class="attribution">
        [<a href="stats">stats</a>]
        [<a href="https://github.com/sigh/iss-sudoku-index" target="_blank" rel="noopener noreferrer">source code</a>]
        [<a href="https://sigh.github.io/" target="_blank" rel="noopener noreferrer">sigh.github.io</a>]
      </nav>
      <div class="segmented" role="group" aria-label="Row density">
        <label>
          <input type="radio" name="density" value="compact">
          <span>Compact</span>
        </label>
        <label>
          <input type="radio" name="density" value="medium" checked>
          <span>Medium</span>
        </label>
        <label>
          <input type="radio" name="density" value="large">
          <span>Large</span>
        </label>
      </div>
    </div>
  </header>

  <section id="controls">
    <div class="filter-row">
      <input type="search" id="filter" placeholder="Filter title, author, constraint, id or link" autocomplete="off">
      <button id="reset-filters" class="pill" type="button" hidden>Reset all</button>
    </div>
    <div class="status-controls">
      <div id="legend" class="legend"><!-- status filter chips, populated by JS --></div>
      <div id="active-filters" class="active-filters" hidden></div>
      <div class="count-actions">
        <span id="count" class="count"></span>
      </div>
    </div>
  </section>

  <main>
    <table id="index">
      <colgroup>
        <col class="col-video">
        <col class="col-puzzle">
        <col class="col-status">
        <col class="col-guesses">
        <col class="col-constraint">
      </colgroup>
      <thead>
        <tr>
          <th data-sort="date" class="col-video">Video/Date</th>
          <th data-sort="title" class="col-puzzle">Puzzle</th>
          <th data-sort="status" class="col-status">Status</th>
          <th data-sort="guesses" class="col-num">Guesses</th>
          <th data-sort="constraint" class="col-constraint">Constraint</th>
        </tr>
      </thead>
      <tbody id="rows"><!-- rows populated by JS --></tbody>
    </table>
    <div id="loading" class="empty">Loading&#8230;</div>
    <div id="sentinel" aria-hidden="true"></div>
    <div id="empty" class="empty" hidden>
      <span>No puzzles match</span>
      <button id="clear-empty" class="pill" type="button">Clear filters</button>
    </div>
    <button id="to-top" class="to-top" type="button" title="Back to top" aria-label="Back to top"
      hidden>&#8593;</button>
  </main>
</body>

</html>
